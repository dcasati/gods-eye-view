apiVersion: apps/v1
kind: Deployment
metadata:
  name: gods-eye-view-acme
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gods-eye-view-acme
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gods-eye-view-acme
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: challenge-only
          image: gods-eye-view:PLACEHOLDER
          command: ["node", "/challenge/server.mjs"]
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: server
              mountPath: /challenge
              readOnly: true
            - name: tokens
              mountPath: /tokens
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: gods-eye-view-acme-server
        - name: tokens
          configMap:
            name: gods-eye-view-acme-token
