# Manual operation only: NOT part of kustomization.yaml. Scale the regional
# Deployment to zero before creating; do not delete its PVC or app cache.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: overpass-austin-refresh-
  namespace: gods-eye-view
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overpass-austin-refresh
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import
          image: acrmiracaldova.azurecr.io/overpass-austin:PLACEHOLDER
          args: ['/opt/regional/bootstrap.py', '--refresh']
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: data
              mountPath: /db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: overpass-austin-data
