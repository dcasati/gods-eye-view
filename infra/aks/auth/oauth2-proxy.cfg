provider = "entra-id"
entra_id_federated_token_auth = true
scope = "openid"
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
insecure_oidc_skip_issuer_verification = false
insecure_oidc_allow_unverified_email = false
skip_oidc_discovery = false
ssl_insecure_skip_verify = false
ssl_upstream_insecure_skip_verify = false

# Authorization is tenant issuer validation plus Entra application assignment,
# not an email suffix. Use the immutable OIDC subject without Graph permissions.
oidc_email_claim = "sub"
user_id_claim = "sub"
email_domains = ["*"]

https_address = "0.0.0.0:4443"
http_address = "127.0.0.1:4180"
tls_cert_file = "/etc/oauth2-proxy/tls/tls.crt"
tls_key_file = "/etc/oauth2-proxy/tls/tls.key"
tls_min_version = "TLS1.2"
# Azure Load Balancer is L4, not a trusted HTTP reverse proxy.
reverse_proxy = false
proxy_websockets = true
pass_host_header = false
pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
set_xauthrequest = false
set_authorization_header = false
skip_auth_strip_headers = true

cookie_name = "__Host-gev_session"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "1h"
cookie_refresh = "0"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
cookie_csrf_expire = "5m"
session_store_type = "cookie"

skip_provider_button = true
skip_auth_preflight = false
skip_jwt_bearer_tokens = false
# These routes REQUIRE authentication; APIs get 401 instead of an HTML redirect.
api_routes = ["^/api(?:/|$)"]
ping_path = "/oauth2/ping"
ready_path = "/oauth2/ready"
show_debug_on_error = false
silence_ping_logging = true
# Never log callback query strings (authorization codes) or session cookies.
request_logging = false
auth_logging = false
standard_logging = true
