apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gods-eye-view-allow-auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gods-eye-view
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gods-eye-view-auth
      ports:
        - protocol: TCP
          port: 4173
