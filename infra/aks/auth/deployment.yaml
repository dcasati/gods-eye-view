apiVersion: apps/v1
kind: Deployment
metadata:
  name: gods-eye-view-auth
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gods-eye-view-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gods-eye-view-auth
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: gods-eye-view-auth
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:PLACEHOLDER
          args: ["--config=/etc/oauth2-proxy/config/oauth2-proxy.cfg"]
          ports:
            - name: https
              containerPort: 4443
          envFrom:
            - configMapRef:
                name: gods-eye-view-auth-environment
          env:
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: gods-eye-view-auth-cookie
                  key: cookie-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /oauth2/ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /oauth2/ping
              port: https
              scheme: HTTPS
            periodSeconds: 15
          volumeMounts:
            - name: settings
              mountPath: /etc/oauth2-proxy/config
              readOnly: true
            - name: tls
              mountPath: /etc/oauth2-proxy/tls
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: gods-eye-view-auth-settings
            defaultMode: 0444
        - name: tls
          secret:
            secretName: gods-eye-view-auth-tls
            defaultMode: 0440
